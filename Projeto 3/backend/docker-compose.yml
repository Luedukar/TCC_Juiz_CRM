services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # O schema é aplicado automaticamente na primeira inicialização do volume
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  # Banco descartável para a suíte de testes (o conftest recria o schema a cada execução).
  # Uso: docker compose --profile test up -d db-test
  db-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
