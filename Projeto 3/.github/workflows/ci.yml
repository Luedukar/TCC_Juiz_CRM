name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://crm:crm@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes (unitários + integração) com cobertura
        run: |
          mkdir -p reports
          pytest --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
      - name: Auditoria de dependências (não bloqueante)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: backend/reports

  frontend:
    name: Frontend (tipos, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Testes com cobertura
        run: npm run test:ci
      - run: npm run build
      - name: Auditoria de dependências (não bloqueante)
        continue-on-error: true
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: |
            frontend/reports
            frontend/coverage

  report:
    name: Relatório consolidado de qualidade
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-reports
          path: backend/reports
      - uses: actions/download-artifact@v4
        with:
          name: frontend-reports
          path: frontend
      - name: Gera docs/RESULTADOS_EXECUCAO.md
        run: python3 scripts/quality_report.py --strict
      - run: cat docs/RESULTADOS_EXECUCAO.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-execucao
          path: docs/RESULTADOS_EXECUCAO.md
